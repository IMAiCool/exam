name: Verify source and Linux containers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: find selfhost worker scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
  linux-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose exec -T exam node scripts/check-judge.mjs
      - name: Check HTTP and clean initial accounts
        run: |
          curl --fail http://127.0.0.1:8787/login > /dev/null
          docker compose exec -T exam node selfhost/account.mjs admin ciadmin
          docker compose exec -T exam node selfhost/account.mjs delete ciadmin
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
