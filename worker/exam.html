<script id="theme-script">
function showExamMessage(message, confirmLabel){
  let dialog=!confirmLabel && document.querySelector('dialog.exam-notice[open]');
  if(!message){ if(dialog)dialog.close(); return }
  if(dialog){ dialog.querySelector('p').textContent=message; return }
  dialog=document.createElement('dialog');
  dialog.className=confirmLabel?'exam-prompt':'exam-prompt exam-notice';
  dialog.setAttribute('role','alertdialog');
  dialog.setAttribute('aria-label',confirmLabel?'确认操作':'提示');
  dialog.innerHTML='<p></p><form method="dialog"><button value="cancel">取消</button><button value="ok"></button></form>';
  const description=dialog.querySelector('p');
  description.id='exam-message-'+document.querySelectorAll('.exam-prompt').length;
  description.textContent=message;
  dialog.setAttribute('aria-describedby',description.id);
  const [cancel,ok]=dialog.querySelectorAll('button');
  cancel.hidden=!confirmLabel;
  ok.textContent=confirmLabel||'知道了';
  (confirmLabel?cancel:ok).autofocus=true;
  document.body.append(dialog);
  const result=new Promise(resolve=>dialog.addEventListener('close',()=>{
    dialog.remove();
    resolve(dialog.returnValue==='ok');
  },{once:true}));
  dialog.showModal();
  return result;
}
function watchProgramTestStatus(target){
  let stopped=false,pending=false;
  const timer=setInterval(async()=>{
    if(stopped||pending||!target.isConnected||document.hidden||!navigator.onLine)return;
    pending=true;
    try{
      const response=await fetch('/api/program-test/status');if(!response.ok)return;
      const status=await response.json();if(stopped||!status||!target.isConnected)return;
      const text=status.state==='queued'?'正在排队'+(status.position?'，等待队列第 '+status.position+' 位':'')+'…':status.state==='preparing'?'正在准备数据库…':'正在运行测试…';
      if(target.textContent!==text)target.textContent=text;
    }catch{}finally{pending=false}
  },700);
  return ()=>{stopped=true;clearInterval(timer)};
}
// Delegate dismissal so server-rendered and dynamically created dialogs behave alike.
(() => {
  let pressedOutside=null;
  function backdrop(event){
    const dialog=event.target;
    if(!(dialog instanceof HTMLDialogElement)||!dialog.open)return null;
    const box=dialog.getBoundingClientRect();
    return event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom?dialog:null;
  }
  document.addEventListener('pointerdown',event=>{pressedOutside=backdrop(event)},true);
  document.addEventListener('click',event=>{
    const dialog=backdrop(event);
    if(dialog&&dialog===pressedOutside)dialog.close('cancel');
    pressedOutside=null;
  },true);
})();
(() => {
  const key = 'exam:theme';
  const system = matchMedia('(prefers-color-scheme: dark)');
  function preference() {
    try { return localStorage.getItem(key) } catch { return null }
  }
  let mode = preference();
  const widthKey='exam:page-width';
  const presetWidths={narrow:640,medium:780,wide:1200};
  const compactViewport=matchMedia('(max-width: 672px)');
  const wideViewport=matchMedia('(orientation: landscape) and (min-width: 900px) and (min-height: 500px)');
  let widthMode,customWidth;
  function applyWidth(){
    const effective=widthMode==='auto'?(compactViewport.matches?'narrow':wideViewport.matches?'wide':'medium'):widthMode;
    const pixels=effective==='custom'?customWidth:presetWidths[effective];
    document.documentElement.dataset.widthMode=effective;
    document.documentElement.style.setProperty('--page-width',pixels+'px');
    const select=document.getElementById('width-mode');
    if(select){
      select.value=widthMode;
      document.getElementById('custom-width-field').hidden=widthMode!=='custom';
      document.getElementById('custom-width').value=customWidth;
    }
  }
  function restoreWidth(){
    let saved;
    try {saved=JSON.parse(localStorage.getItem(widthKey))} catch {}
    widthMode=saved?.mode==='custom'||Object.hasOwn(presetWidths,saved?.mode)?saved.mode:'auto';
    customWidth=Number.isSafeInteger(saved?.pixels)&&saved.pixels>=320?saved.pixels:780;
    applyWidth();
  }
  function saveWidth(){
    applyWidth();
    try {localStorage.setItem(widthKey,JSON.stringify({mode:widthMode,pixels:customWidth}))} catch {}
  }
  restoreWidth();
  for(const viewport of [compactViewport,wideViewport]){
    viewport.addEventListener('change',()=>{if(widthMode==='auto')applyWidth()});
  }
  const wallpaperGroups=[
    ['浅色系',[
      ['salt','盐汽水气泡'],['peach','白桃乌龙奶盖'],
      ['muscat','晨雾青提'],['oat','燕麦拿铁'],['snow','初雪暮光']]],
    ['深色系',[
      ['berry','午夜蓝莓'],['forest','黑松露森林'],
      ['obsidian','曜石星尘'],['burgundy','勃艮第夜曲'],['whale','深海鲸歌']]],
    ['混合渐变系',[
      ['sunset','橘子海日落'],
      ['glacier','极光冰川'],
      ['monet','莫奈睡莲池'],
      ['neon','赛博霓虹雨'],
      ['matcha','抹茶红豆冰']]],
    ['经典',[
      ['aurora','极光粉蓝'],['ocean-glow','深海幽光'],['sun-amber','日落琥珀'],['blue','晨蓝'],
      ['sage','鼠尾草绿'],['sand','暖沙']]]
  ];
  const wallpapers=wallpaperGroups.flatMap(([,items])=>items);
  function applyBackground(value) {
    const [background,name]=wallpapers.find(([id])=>id===value)||wallpapers.find(([id])=>id==='salt');
    document.documentElement.dataset.background=background;
    const current=document.querySelector('#background-toggle .wall-name');
    if(current)current.textContent=name;
    for(const radio of document.querySelectorAll('#background-choice input'))radio.checked=radio.value===background;
  }
  function setMode(value){
    mode=value;
    apply();
    try { localStorage.setItem(key,mode) } catch {}
  }
  function restoreBackground(){
    try { applyBackground(localStorage.getItem('exam:background')) } catch { applyBackground('salt') }
  }
  restoreBackground();
  function apply() {
    if (mode !== 'light' && mode !== 'dark') mode = 'system';
    document.documentElement.dataset.theme = mode === 'system' ? (system.matches ? 'dark' : 'light') : mode;
    const control = document.getElementById('theme-mode');
    if (control) {
      const action = document.documentElement.dataset.theme === 'dark' ? '切换到日间模式' : '切换到夜间模式';
      if(control.closest('.settings-panel')){
        control.setAttribute('role','switch');
        control.setAttribute('aria-checked',String(document.documentElement.dataset.theme==='dark'));
        control.setAttribute('aria-label','深色模式');
      }else control.setAttribute('aria-label', action);
      control.title = action;
    }
  }
  apply();
  document.addEventListener('DOMContentLoaded', () => {
    for(const logout of document.querySelectorAll('form[action="/logout"],a.sign-out')){
      let pending=false;
      logout.addEventListener(logout.tagName==='FORM'?'submit':'click',async event=>{
        event.preventDefault();
        if(pending)return;
        pending=true;
        try{
          if(!await showExamMessage('确定退出当前账号吗？','退出登录'))return;
          if(logout.tagName==='FORM')HTMLFormElement.prototype.submit.call(logout);
          else window.open(logout.href,logout.target||'_self');
        }finally{pending=false}
      });
    }
    apply();
    restoreBackground();
    const settings=document.querySelector('.settings-menu');
    if(settings){
      applyWidth();
      const reminder=document.getElementById('publish-reminder');
      if(reminder){
        const preferenceKey='exam:publish-reminder:'+reminder.dataset.account;
        function loadReminder(){
          try { reminder.checked=localStorage.getItem(preferenceKey)!=='off' } catch {}
        }
        loadReminder();
        reminder.onchange=()=>{try{localStorage.setItem(preferenceKey,reminder.checked?'on':'off')}catch{}};
        window.addEventListener('storage',event=>{if(!event.key||event.key===preferenceKey)loadReminder()});
      }
      const widthSelect=document.getElementById('width-mode'),widthInput=document.getElementById('custom-width');
      widthSelect.onchange=()=>{
        widthMode=widthSelect.value;
        saveWidth();
        if(widthMode==='custom'){widthInput.focus();widthInput.select()}
      };
      widthInput.onchange=()=>{
        if(!widthInput.reportValidity()||!Number.isSafeInteger(widthInput.valueAsNumber)){
          widthInput.value=customWidth;
          return;
        }
        customWidth=widthInput.valueAsNumber;
        saveWidth();
      };
      for(const [id,method] of [['width-down','stepDown'],['width-up','stepUp']]){
        document.getElementById(id).onclick=()=>{
          widthInput[method]();
          widthInput.dispatchEvent(new Event('change',{bubbles:true}));
        };
      }
      widthInput.onkeydown=event=>{if(event.key==='Enter')widthInput.blur()};
      const picker=document.getElementById('background-choice');
      const trigger=document.getElementById('background-toggle');
      for(const [group,items] of wallpaperGroups){
        const field=document.createElement('fieldset');
        field.innerHTML='<legend>'+group+'</legend>'+items.map(([id,name])=>
          '<label><input type="radio" name="wallpaper" value="'+id+'"><span class="wall-sample" data-background="'+id+'"></span>'+name+'</label>').join('');
        picker.append(field);
      }
      restoreBackground();
      function expandPicker(open){
        picker.hidden=!open;
        trigger.setAttribute('aria-expanded',String(open));
      }
      trigger.onclick=()=>expandPicker(picker.hidden);
      settings.addEventListener('toggle',()=>{if(!settings.open)expandPicker(false)});
      picker.addEventListener('change',async event=>{
        const previous=document.documentElement.dataset.background;
        const next=event.target.value;
        applyBackground(next);
        try { localStorage.setItem('exam:background',next) } catch {}
        const darkGroup=wallpaperGroups.find(([name])=>name==='深色系')[1];
        const isDarkBackground=value=>darkGroup.some(([id])=>id===value);
        if(isDarkBackground(next) && document.documentElement.dataset.theme==='light'){
          if(await showExamMessage('已选择深色系背景，是否同时开启深色模式？','开启深色模式'))setMode('dark');
        }else if(isDarkBackground(previous) && !isDarkBackground(next) && document.documentElement.dataset.theme==='dark'){
          if(await showExamMessage('已切换背景，是否同时切换为浅色模式？','切换为浅色模式'))setMode('light');
        }
      });
      document.addEventListener('pointerdown',event=>{
        if(settings.open && !settings.contains(event.target) && !event.target.closest('.exam-prompt'))settings.open=false;
      });
      document.addEventListener('keydown',event=>{
        if(event.key==='Escape' && settings.open && !document.querySelector('.exam-prompt[open]')){
          settings.open=false;
          settings.querySelector('summary').focus();
        }
      });
    }
    const confirmedActions=new WeakSet(),pendingActions=new WeakSet();
    document.addEventListener('submit',async event=>{
      const button=event.submitter;
      if(!button?.dataset.confirm||confirmedActions.has(button))return;
      event.preventDefault();if(pendingActions.has(button))return;
      pendingActions.add(button);
      try{
        if(await showExamMessage(button.dataset.confirm,'删除')){
          confirmedActions.add(button);button.form.requestSubmit(button);confirmedActions.delete(button);
        }
      }finally{pendingActions.delete(button)}
    });
    for(const status of document.querySelectorAll('main p[role="status"]:not(#draft-status),main p[role="alert"]')){
      const message=status.innerText.trim();
      status.hidden=true;
      if(message)showExamMessage(message);
    }
    let invalidField=null;
    document.addEventListener('invalid',event=>{
      if(!event.target.form)return;
      event.preventDefault();
      if(invalidField)return;
      invalidField=event.target;
      const field=invalidField;
      const label=field.labels?.[0]?.firstChild?.textContent.trim();
      Promise.resolve(showExamMessage((label?label+'：':'')+field.validationMessage)).then(()=>{
        invalidField=null;
        field.focus();
      });
    },true);
    const wallpaper=document.createElement('div');
    wallpaper.className='wallpaper';
    wallpaper.setAttribute('aria-hidden','true');
    for(let i=1;i<=3;i++){
      const blob=document.createElement('span');
      blob.className='blob blob-'+i;
      wallpaper.append(blob);
    }
    document.body.prepend(wallpaper);
    const motionChoice=document.getElementById('star-motion');
    const reduced=matchMedia('(prefers-reduced-motion:reduce)');
    const motionKey='exam:star-motion';
    function restoreMotion(){
      let preference;
      try{preference=localStorage.getItem(motionKey)}catch{}
      const motion=preference||'static';
      wallpaper.dataset.motion=motion;
      const radio=motionChoice?.querySelector(motion==='static'?'[value="static"]':'[value="dynamic"]');
      if(radio)radio.checked=true;
    }
    restoreMotion();
    motionChoice?.addEventListener('change',event=>{
      wallpaper.dataset.motion=event.target.value;
      try{localStorage.setItem(motionKey,event.target.value)}catch{}
    });
    reduced.addEventListener('change',restoreMotion);
    window.addEventListener('storage',event=>{if(event.key===motionKey||event.key===null)restoreMotion()});
    const dock=document.querySelector('.teacher-dock,.student-dock,.auth-dock');
    if(dock){
      const marker=dock.querySelector('.dock-indicator');
      const key='exam:'+Array.from(dock.classList).find(name=>name!=='floating-dock' && name.endsWith('-dock'))+'-from';
      const index=()=>Number(getComputedStyle(dock).getPropertyValue('--dock-index'))||0;
      // Begin moving while the linked page loads; carry the visible position across navigation.
      dock.addEventListener('click',event=>{
        const link=event.target.closest('a[href]');
        if(!marker || !link || event.defaultPrevented || event.button!==0 ||
          event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)return;
        const url=new URL(link.href);
        if(url.origin!==location.origin || (url.pathname===location.pathname && url.search===location.search))return;
        const tabs=Array.from(dock.querySelectorAll(':scope > a,:scope > button'));
        marker.style.setProperty('--pending-tab',tabs.indexOf(link));
      });
      window.addEventListener('pagehide',()=>{
        try{
          if(marker){
            const transform=getComputedStyle(marker).transform;
            const offset=transform==='none'?0:new DOMMatrixReadOnly(transform).m41;
            sessionStorage.setItem(key,String(offset / marker.getBoundingClientRect().width));
          }
          else sessionStorage.removeItem(key);
        }catch{}
        marker?.style.removeProperty('--pending-tab');
      });
      function resumeIndicator(){
        let from;
        try{
          from=sessionStorage.getItem(key);
          sessionStorage.removeItem(key);
        }catch{return}
        if(!marker || from===null || Number(from)===index() || matchMedia('(prefers-reduced-motion: reduce)').matches)return;
        // Start at the previous tab, then let the same CSS transition handle both kinds of switch.
        marker.style.transition='none';
        marker.style.transform='translateX('+Number(from)*100+'%)';
        marker.getBoundingClientRect();
        marker.style.removeProperty('transition');
        marker.style.removeProperty('transform');
      }
      resumeIndicator();
      window.addEventListener('pageshow',event=>{if(event.persisted)resumeIndicator()});
    }
    document.getElementById('theme-mode').addEventListener('click', () => {
      setMode(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
  });
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if(event.key===widthKey||event.key===null)restoreWidth();
    if(event.key==='exam:background'||event.key===null)restoreBackground();
    if (event.key === key || event.key === null) { mode = preference(); apply() }
  });
})();
</script>

<script id="syntax-script">
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pythonKeywords=new Set('False None True and as assert async await break case class continue def del elif else except finally for from global if import in is lambda match nonlocal not or pass raise return try while with yield'.split(' '));
const languages = {
  Python: {keywords:pythonKeywords, pattern:/(?<string>"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(?<comment>#[^\n]*)|(?<number>\b(?:0[xX][\da-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(?:\.[\d_]*)?(?:[eE][+-]?[\d_]+)?)[jJ]?\b)|(?<word>[\p{L}_][\p{L}\p{N}_]*)/gu},
  JavaScript: {

function tokensFor(source,language){
  const rules=languages[language]??languages.Python;
  const tokens=[];
  if(!rules.pattern)return tokens;
  let previous='';
  for(const match of source.matchAll(rules.pattern)){
    const {string,comment,number,word,property}=match.groups;
    const start=match.index,end=start+match[0].length;
    let kind=property?'property':string?'string':comment?'comment':number?'number':null;
    if(word){
      const sql=language==='SQL';
      if(sql&&/^(COUNT|SUM|AVG|MAX|MIN)$/i.test(word))kind='function';
      else if(rules.keywords.has(sql?word.toUpperCase():word))kind=flowWords.has(word)&&!sql?'control':'keyword';
      else if(!sql&&(previous==='class'||previous==='interface'||previous==='new'||builtinTypes.has(word)))kind='type';
      else if(/^\s*\(/.test(source.slice(end)))kind='function';
      else if(!sql&&language!=='JSON')kind='variable';
    }
    if(kind)tokens.push({start,end,kind});
    if(!comment)previous=word??'';
  }
  return tokens;
}
function highlightCode(source,language){
  let end=0, html='';
  for(const token of tokensFor(source,language)){
    html+=esc(source.slice(end,token.start))+'<span class="tok-'+token.kind+'">'+esc(source.slice(token.start,token.end))+'</span>';
    end=token.end;
  }
  return html+esc(source.slice(end));
}

function paperMarkdown(paper){
  const literal=text=>text.replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replace(/([\\`*])/g,'\\$1').replace(/_{2,}/g,run=>'\`'+run+'\`')
    .replace(/^(\s*)([#>~]|[-+] |\d+\.(?=\s)|[A-Z][.)](?=\s))/gm,(_,space,token)=>space+token.replace(/[.#>~+)\-]/,'\\$&'));
  const blocks=['# '+literal(paper.title),'> 填写说明：'+paperImportGuide,'总分 '+paper.target+' 分','题号：整卷序号','考试时长：'+(paper.minutes??0)+' 分钟'];
  if(typeof paper.aiGrading==='boolean')blocks.push('AI 自动评分：'+(paper.aiGrading?'启用':'关闭'));
  for(const [section,group] of questionGroups(paper.questions).entries()){
    blocks.push('## '+sectionTitle(section,group[0].question.type,group[0].question));
    for(const {question:q,index} of group){
      blocks.push('### 第 '+(index+1)+' 题 · '+q.score+' 分');
      for(const rows of q.tables??[]){
        const line=row=>'| '+row.map(cell=>literal(cell).replaceAll('|','\\|').replaceAll('\n','<br>')).join(' | ')+' |';
        blocks.push([line(rows[0]),line(rows[0].map(()=>'---')),...rows.slice(1).map(line)].join('\n'));
      }
      if(q.customType)blocks.push('自定义题型：'+JSON.stringify(q.customType),'答题组件：'+types[q.type]);
      if(q.type===5&&q.defaultLanguage)blocks.push('默认编程语言：'+q.defaultLanguage);
      if(q.sharedStem)blocks.push('#### 共用题干',literal(q.sharedStem),'#### 本题题干');
      blocks.push(literal(q.prompt));
      for(const b of q.codeBlocks??[]){
        blocks.push(markdownCode(b.code,b.language));
        if(b.followingText)blocks.push(literal(b.followingText));
      }
      if(q.type<=2)options(q).forEach((option,i)=>blocks.push(String.fromCharCode(65+i)+'. '+literal(option).replaceAll('\n','\n  ')));
      if(q.type===5)(q.testCases??[]).forEach((c,i)=>{
        if(c.input)blocks.push('#### 示例输入 '+(i+1),markdownCode(c.input,'text'));
        blocks.push('#### 预期输出 '+(i+1),markdownCode(c.output,'text'));
      });
      if(q.type<4)blocks.push('作答：'+exportAnswerSlots(q).join('  '));
      else blocks.push('作答：',...exportAnswerSlots(q));
    }
  }
  return blocks.join('\n\n')+'\n';
}

        const pos=field.hasAttribute('data-caret')?field.selectionStart:field.value.length;
        let highest=0;
        for(const el of fields){
          for(const match of el.value.matchAll(/^\s*[（(](\d{1,9})[)）]/gm))highest=Math.max(highest,Number(match[1]));
        }
        const insertion='('+(highest+1)+') ',caret=insertion.length;
        const prefix=pos&&field.value[pos-1]!=='\n'?'\n':'';

        field.setRangeText(prefix+insertion+suffix,pos,pos,'end');

      const tail=field.value.slice(pos);
      field.value=field.value.slice(0,pos);
      const markup=snippetEditor({language:article.querySelector('.default-language')?.value??'Python',code:''})+continuationField(tail);
      if(field.parentElement===list)field.insertAdjacentHTML('afterend',markup);
      else list.insertAdjacentHTML('afterbegin',markup);
      const snippet=field.parentElement===list?field.nextElementSibling:list.firstElementChild;
      snippet.nextElementSibling.focus();
      snippet.nextElementSibling.setSelectionRange(0,0);
      snippet.querySelector('textarea').focus();
      return;
    }
    if(event.target.closest('[data-remove-snippet]')){
      const snippet=event.target.closest('.question-snippet');
      const before=snippet.previousElementSibling??snippet.closest('article').querySelector('.prompt-input');
      const after=snippet.nextElementSibling;
      const pos=before.value.length;
      before.value+=after.value;

      before.focus();before.setSelectionRange(pos,pos);
      return;
    }
    if(event.target.hasAttribute('data-add-blank')){
      const article=event.target.closest('article');
      const field=article.querySelector('[data-caret]')??article.querySelector('.prompt-input');
      const start=field.selectionStart,end=field.selectionEnd;

      return insertQuestion(Number(current.dataset.type),Number(after)+1,current.querySelector('.default-language')?.value,current.dataset.customType);

  function remember(kind){
    if(!hosted?.teacher||!byId('questions'))return;

    if(kind==='published'){

    view.addEventListener('change',persist);

}

    for(const m of source.matchAll(/"((?:\\.|[^"\\])+)"\s*:/g))add(m[1],'对象字段');

function importedCompletions(language, source, start, end){
  const catalog=importCatalog[language];
  if(!catalog)return null;
  const bindings=new Map(),modules=new Map();
  const observed=new Map();
  function remember(path,name){
    if(!observed.has(path))observed.set(path,new Set());
    observed.get(path).add(name);
  }
  function exportsOf(name){
    const indexed=Object.hasOwn(catalog,name)?catalog[name].split(' ').filter(Boolean):[];
    const children=Object.keys(catalog).filter(path=>path.startsWith(name+'.')).map(path=>path.slice(name.length+1).split('.')[0]);
    const symbols=new Set([...indexed,...children,...(observed.get(name)||[])]);
    return symbols.size?[...symbols]:null;
  }
  const before=source.slice(0,start);
  const after=source.slice(end);
  const line=before.slice(before.lastIndexOf('\n')+1);
  let members=null;
  if(language==='Python'){
    // Ignore imports written inside comments and string literals, including docstrings.
    const code=before.replace(languages.Python.pattern,(token,...args)=>{
      const {string,comment}=args.at(-1);
      return string||comment?token.replace(/[^\n]/g,' '):token;
    });
    const statements=code.replace(/\\\r?\n/g,' ').replace(/(\bfrom\s+[\w.]+\s+import\s*\()([^)]*)(\)|$)/g,
      (_,open,list,close)=>open+list.replace(/\s+/g,' ')+close).split(/[;\n]/);
    const last=statements.pop().trimStart();
    for(const statement of statements){
      const match=statement.trim().match(/^(?:from\s+([\w.]+)\s+)?import\s+(.+)$/);
      if(!match)continue;
      const [,parent,list]=match;
      for(const item of list.replace(/[()]/g,'').split(',')){
        const [name,alias]=item.trim().split(/\s+as\s+/);
        if(!name)continue;
        if(parent && name==='*'){
          for(const symbol of exportsOf(parent)||[])bindings.set(symbol,'导入成员');
        }else{
          if(parent)remember(parent,name);
          const path=parent?parent+'.'+name:name;
          const local=alias||(parent?name:name.split('.')[0]);
          bindings.set(local,parent?'导入成员':'模块');
          modules.set(local,alias||parent?path:local);
        }
      }
    }
    const from=last.match(/^from\s+([\w.]+)\s+import\s+[\s\w,()]*$/);
    const receiver=line.match(/([\w]+(?:\.[\w]+)*)\.$/);
    if(from)members=exportsOf(from[1]);
    else if(/^(?:from|import)\s+[\w.]*$/.test(last)){
      const path=last.match(/([\w.]+\.)$/)?.[1]||'';
      members=Object.keys(catalog).filter(n=>n.startsWith(path)).map(n=>n.slice(path.length).split('.')[0]);
    }else if(receiver){
      const [root,...rest]=receiver[1].split('.');
      if(modules.has(root))members=exportsOf([modules.get(root),...rest].join('.'));
    }
  }else if(language==='JavaScript'){
    const clean=before.replace(languages.JavaScript.pattern,(token,...args)=>{
      const {string,comment}=args.at(-1);
      if(comment)return token.replace(/[^\n]/g,' ');
      if(string&&!/^['"](?:node:)?[\w./@-]+['"]$/.test(token))return token.replace(/[^\n]/g,' ');
      return token;
    });
    for(const match of clean.matchAll(/\bimport\s+([^;'"\x60]+?)\s+from\s*['"](?:node:)?([^'"]+)['"]/g)){
      const [,clause,path]=match;
      const namespace=clause.match(/\*\s+as\s+([\w$]+)/)?.[1];
      const defaultName=clause.match(/^([\w$]+)/)?.[1];
      for(const name of [namespace,defaultName].filter(Boolean)){modules.set(name,path);bindings.set(name,'导入模块')}
      for(const item of (clause.match(/\{([^}]*)\}/)?.[1]||'').split(',')){
        const [name,alias]=item.trim().split(/\s+as\s+/);
        if(name){remember(path,name);bindings.set(alias||name,'导入成员')}
      }
    }
    for(const [,local,path] of clean.matchAll(/\b(?:const|let|var)\s+([\w$]+)\s*=\s*require\(\s*['"](?:node:)?([^'"]+)['"]\s*\)/g)){
      modules.set(local,path);bindings.set(local,'导入模块');
    }
    for(const [,items,path] of clean.matchAll(/\b(?:const|let|var)\s*\{([^}]+)\}\s*=\s*require\(\s*['"](?:node:)?([^'"]+)['"]\s*\)/g)){
      for(const item of items.split(',')){const [name,alias]=item.trim().split(/\s*:\s*/);if(name){remember(path,name);bindings.set(alias||name,'导入成员')}}
    }
    const receiver=line.match(/([\w$]+)\??\.$/)?.[1];
    if(receiver && modules.has(receiver))members=exportsOf(modules.get(receiver));
    if(/\bimport\s*(?:[\w$]+\s*,\s*)?\{[^}]*$/.test(clean)){
      const path=after.match(/^[^}]*\}\s*from\s*['"](?:node:)?([^'"]+)['"]/)?.[1];
      if(path)members=exportsOf(path);
    }
  }else if(language==='Java'){
    const code=before.replace(languages.Java.pattern,(token,...args)=>{
      const {string,comment}=args.at(-1);
      return string||comment?token.replace(/[^\n]/g,' '):token;
    });
    for(const [,path] of code.matchAll(/\bimport\s+(?:static\s+)?([\w.]+(?:\.\*)?)\s*;/g)){
      const split=path.lastIndexOf('.'),pkg=path.slice(0,split),name=path.slice(split+1);
      if(name==='*'){for(const type of exportsOf(pkg)||[])bindings.set(type,'导入类型')}
      else bindings.set(name,'导入成员');
    }
    const pkg=code.match(/\bimport\s+([\w.]+)\.$/)?.[1];
    if(pkg)members=exportsOf(pkg)||Object.keys(catalog).filter(n=>n.startsWith(pkg+'.')).map(n=>n.slice(pkg.length+1).split('.')[0]);
  }
  return {bindings,members};
}

view.addEventListener('keydown',event=>{
  const input=event.target;
  if(event.key!=='Enter'||event.isComposing||event.keyCode===229||event.ctrlKey||event.metaKey||event.altKey||
      !input.matches('.code-body textarea')||input.disabled||input.readOnly)return;
  const language=input.closest('.code-editor').querySelector('select')?.value??'text';
  const edit=codeNewline(input,language);
  event.preventDefault();
  input.setSelectionRange(input.selectionStart,edit.end);
  if(!document.execCommand('insertText',false,edit.text)){
    input.setRangeText(edit.text,input.selectionStart,edit.end,'end');
    input.dispatchEvent(new Event('input',{bubbles:true}));
  }
  input.setSelectionRange(edit.caret,edit.caret);
});
const paintedCode=new WeakMap();
function paintCode(input,language){
  const previous=paintedCode.get(input);
  if(previous?.source===input.value&&previous.language===language)return;
  input.previousElementSibling.innerHTML=highlightCode(input.value,language)+'\n';
  paintedCode.set(input,{source:input.value,language});
}
function choiceOptions(question,index){
  return options(question).map((text,j)=>{
    const data=`data-question="${index}" data-option="${j}"`;
    const type=question.type===1?'checkbox':'radio';
    const prefix=question.type===2?'':String.fromCharCode(65+j)+'. ';
    return `<label class="choice-row"><input type="${type}" name="question-${index}" ${data}><span>${prefix}${esc(text)}</span></label>`;
  }).join('');
}
function scoreDetail(group){
    const counts=new Map();
    for(const q of group)counts.set(q.score,(counts.get(q.score)||0)+1);
    return counts.size===1?'每题 '+group[0].score+' 分':
      [...counts].map(([score,count])=>count+' 题每题 '+score+' 分').join('、');
}
function paperSummary(){
  const rows=questionGroups(exam.questions).map((entries,index)=>{
    const group=entries.map(entry=>entry.question);
    const name=sectionTitle(index,group[0].type,group[0]);
    const detail=scoreDetail(group);
    return '<div><dt>'+name+'</dt><dd>共 '+group.length+' 题，'+detail+'，共 '+total(group)+' 分</dd></div>';
  });
  const identity=hosted?.id?'学生姓名 · '+esc(hosted.studentName||'未填写'):'试卷概览';
  return '<div class="score-heading"><strong>'+identity+'</strong><span>满分 '+total(exam.questions)+' 分</span></div><dl class="score-summary">'+rows.join('')+'</dl>';
}
function blankValues(question,value){
  const count=questionBlankCount(question);
  return Array.from({length:count},(_,n)=>Array.isArray(value)?value[n]??'':n===0?value??'':'');
}
function fillQuestion(q,i,number){
  const label='填空题第 '+number+' 题';
  const values=blankValues(q,answers[i]);
  if(!values.length)return showPrompt(q,number)+'<input class="answer inline-blank" aria-label="'+label+'答案" data-question="'+i+'" value="'+esc(answers[i])+'">';
  let n=0;
  function blank(){
    const index=n++;
    return '<span class="detached-blank-label">第 '+n+' 空 </span><input class="answer inline-blank" aria-label="'+label+'第 '+n+' 空" data-question="'+i+'" data-blank="'+index+'" value="'+esc(values[index])+'">';
  }
  return showPrompt(q,number,text=>esc(text).split(/(_{3,})/g).map(part=>
    /^_{3,}$/.test(part)?blank():'<span class="blank-stem">'+part+'</span>').join(''),
    (code,language)=>{
      // An identifier stays intact in the highlighter, including inside strings and comments.
      let marker='ExamBlankSlot';
      while(code.includes(marker))marker+='_';
      return highlightCode(code.replace(/〔填空〕|(?<![\p{L}\p{N}_])_{3,}(?![\p{L}\p{N}_])/gu,marker),language).replaceAll(marker,blank);
    });
}
function questionComplete(i){
  const numbers=subquestionNumbers(exam.questions[i]);
  if(numbers.length){
    const parts=subquestionParts(numbers,answers[i]);
    return numbers.every(n=>parts[n]?.trim());
  }
  if(exam.questions[i].type===3){
    const blanks=blankValues(exam.questions[i],answers[i]);
    if(blanks.length)return blanks.every(text=>text.trim());
  }
  return answered(answers[i]);
}

const navGradeLabels={correct:'正确',partial:'部分得分',incorrect:'错误',ungraded:'未计分'};
function initialQuestionScore(report,q,i,ai){
  if(ai)return ai.score;
  if(q.type===5&&report.testing&&q.testCases?.length)return null;
  return report.initial[i]??null;
}
function updateNavQuestion(link,i,scores,stage){
  const complete=questionComplete(i);
  let status=complete?'已作答':'未作答';
  if(scores){
    const score=scores[i], maximum=exam.questions[i].score;
    const grade=!Number.isFinite(score)||!(maximum>0)?'ungraded':score>=maximum?'correct':score>0?'partial':'incorrect';
    link.dataset.grade=grade;
    status=stage+'，'+navGradeLabels[grade];
  }else delete link.dataset.grade;
  link.classList.toggle('complete',!scores&&complete);
  link.classList.toggle('marked',marked.has(i));
  link.title=link.dataset.label+'，'+status+(marked.has(i)?'，已标记':'');
  link.setAttribute('aria-label',link.title);
}

let closeQuestionCard=()=>{};
function measureQuestionCard(content){
  const maxWidth=Math.max(320,Math.min(1000,screen.availWidth*.8));
  const maxHeight=Math.max(200,screen.availHeight*.76);
  let width=Math.min(440,maxWidth);
  content.style.width=width+'px';
  while(content.offsetHeight+80>maxHeight&&width<maxWidth){
    width=Math.min(maxWidth,Math.ceil(width*1.25));
    content.style.width=width+'px';
  }
  return {width:Math.ceil(width),height:Math.ceil(content.offsetHeight+80)};
}
function createVideoQuestionCard(onClose,onPreparing){
  const headerHeight=44;
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');

  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

  }

      reason=ai.reason||(ai.tries<3?'AI 正在评分。':'AI 评分未完成，待教师评阅。');
    }else if(q.type===5&&report.testing&&q.testCases?.length){

  });
  const complete=count===exam.questions.length;
  const total=report.final?.reduce((sum,n)=>sum+Math.round(n*100),0);

  view.innerHTML='<section id="paper-cover">'+paperSummary()+'<label>导入教师试卷 <input id="import" type="file" accept=".json,application/json"></label></section>'+renderGroups(exam.questions,(q,i,number)=>'<article id="exam-question-'+i+'" tabindex="-1"><div class="question-card-tools"><button type="button" class="mark-question" data-mark="'+i+'" aria-pressed="'+marked.has(i)+'" aria-label="标记'+types[q.type]+'第 '+number+' 题">'+flagIcon+'</button></div>'+studentQuestion(q,i,number)+'</article>')+'<div class="row exam-actions">'+(submitted?'<button id="restart">重新作答</button>':'')+'</div>';
  revealQuestion=bindQuestionPager(()=>{
    if(!submitted&&!hosted?.id&&exam.minutes>0&&!deadline){
      deadline=Date.now()+exam.minutes*60000;
      save('practice-deadline',deadline);
      view.querySelector('.cover-clock')?.remove();
      runClock();
      showQuestionNav();
    }
  });
  if(hosted?.id&&!submitted&&['#begin','#resume-question'].includes(location.hash)){
    const savedId=location.hash==='#resume-question'?read('last-question',null):null;
    const page=Array.from(view.querySelectorAll('article[id^="exam-question-"]')).find(article=>article.id===savedId);
    history.replaceState(history.state,'',location.pathname+location.search);
    revealQuestion(page||view.querySelector('article'));
  }
  if(hosted?.id&&!submitted){
    for(const [i,q] of exam.questions.entries()){
      if(q.type!==5||!q.testCases?.length)continue;
      const article=byId('exam-question-'+i),source=article.querySelector('textarea.answer'),language=article.querySelector('.code-language');
      const panelId='test-cases-'+i;
      article.querySelector('.written-answer').insertAdjacentHTML('beforeend','<div class="row case-actions"><button type="button" class="case-toggle" aria-haspopup="dialog" aria-controls="'+panelId+'"></button><button type="button" class="run-tests">运行测试</button></div>'+
        '<dialog id="'+panelId+'" class="case-dialog" aria-labelledby="'+panelId+'-title"><h2 id="'+panelId+'-title">选择测试用例</h2><label class="grading-toggle case-switch">全选<input type="checkbox" role="switch" data-case-all checked><span class="theme-switch" aria-hidden="true"></span></label><div class="case-list">'+
        q.testCases.map((c,n)=>'<div class="case-item"><details><summary>用例 '+(n+1)+'</summary>'+(c.input?'<p>示例输入</p><pre>'+esc(c.input)+'</pre>':'')+'<p>预期输出</p><pre>'+esc(c.output||'（空）')+'</pre></details><label class="grading-toggle case-switch"><input type="checkbox" role="switch" aria-label="用例 '+(n+1)+'" value="'+n+'" checked><span class="theme-switch" aria-hidden="true"></span></label></div>').join('')+
        '</div><div class="row"><button type="button" class="case-cancel">取消</button><button type="button" class="case-confirm">确定</button></div></dialog><p class="case-hint" hidden></p><dialog class="case-dialog test-report" aria-labelledby="'+panelId+'-result-title"><header><h2 id="'+panelId+'-result-title">测试结果</h2><button type="button" aria-label="关闭测试结果"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div class="test-result" role="status"></div></dialog>');
      const run=article.querySelector('.run-tests'),result=article.querySelector('.test-result');
      const report=article.querySelector('.test-report'),hint=article.querySelector('.case-hint');
      report.querySelector('button').onclick=()=>report.close();
      const toggle=article.querySelector('.case-toggle'),panel=byId(panelId);
      const boxes=Array.from(panel.querySelectorAll('.case-list input'));
      const all=panel.querySelector('[data-case-all]');
      const syncAll=()=>{all.checked=boxes.every(box=>box.checked)};
      all.onchange=()=>{for(const box of boxes)box.checked=all.checked};
      panel.querySelector('.case-list').onchange=syncAll;
      const selected=()=>boxes.filter(box=>box.checked).map(box=>Number(box.value));
      let committed=selected();
      toggle.onclick=()=>{
        for(const box of boxes)box.checked=committed.includes(Number(box.value));
        syncAll();
        for(const item of panel.querySelectorAll('.case-item details[open]'))item.open=false;
        panel.showModal();
      };
      panel.querySelector('.case-cancel').onclick=()=>panel.close();
      panel.querySelector('.case-confirm').onclick=()=>{
        const next=selected();
        panel.close();
        if(next.length===committed.length&&next.every((value,index)=>value===committed[index]))return;
        committed=next;
        reset();
      };
      let generation=0,busy=false;
      const canRun=()=>['Python','JavaScript','Java','SQL'].includes(language.value);
      function reset(){
        generation++;
        const count=committed.length;
        toggle.textContent='测试用例（'+count+'/'+q.testCases.length+'）';
        hint.textContent=canRun()?(count?(language.value==='SQL'?'SQL 仅可操作 exam_db 内的表、字段和记录，禁止建库、删库或修改数据库设置。':''):'请至少选择一组测试用例。'):'此语言由教师评分，试跑支持 Python、JavaScript、Java 8 和 MySQL SQL。';
        hint.hidden=!hint.textContent;
        run.disabled=busy||!canRun()||!count;
      }
      article.addEventListener('input',event=>{if(event.target.matches('textarea.answer'))reset()});
      article.addEventListener('change',event=>{if(event.target.matches('.code-language'))reset()});
      reset();
      run.onclick=async()=>{
        const version=generation,caseIndices=committed;
        report.showModal();
        busy=true;run.disabled=true;result.textContent=language.value==='SQL'?'正在排队或运行 SQL 测试…':'正在运行测试…';
        const stopStatus=watchProgramTestStatus(result);
        try{
          const response=await fetch('/api/program-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:hosted.id,index:i,code:answers[i]?.parts?subquestionText(q,answers[i],false):source.value,language:language.value,caseIndices})});
          if(!response.ok)throw Error(await response.text());
          const {details,passed,score}=await response.json();
          stopStatus();
          if(version===generation){
            result.innerHTML='<p>通过 '+passed+' / '+details.length+' 组'+(score===null?'（所选用例）':' · 当前试跑得分 '+score+' / '+q.score+' 分')+'</p>'+
              details.map((row,n)=>'<section><strong>用例 '+(caseIndices[n]+1)+'：'+esc(row.status)+'</strong>'+
                (q.testCases[caseIndices[n]].input?'<p>示例输入</p><pre>'+esc(q.testCases[caseIndices[n]].input)+'</pre>':'')+
                '<p>预期输出</p><pre>'+esc(q.testCases[caseIndices[n]].output||'（空）')+'</pre>'+
                '<p>实际输出</p><pre>'+esc(row.actual||'（无输出）')+'</pre>'+
                (row.diagnostic?'<p>诊断信息</p><pre>'+esc(row.diagnostic)+'</pre>':'')+'</section>').join('');
          }
        }catch(error){stopStatus();if(version===generation)result.textContent=error.message}
        finally{stopStatus();busy=false;run.disabled=!canRun()||!committed.length}
      };
    }
  }
  showQuestionNav();
  view.querySelectorAll('[data-mark]').forEach(button=>button.onclick=()=>{
    const i=Number(button.dataset.mark);
    if(marked.has(i))marked.delete(i);else marked.add(i);
    button.setAttribute('aria-pressed',String(marked.has(i)));
    save(marksKey,[...marked]);
  });
  const optionGroups=new Map();
  for(const field of view.querySelectorAll('[data-option]')){
    const i=Number(field.dataset.question);
    if(!optionGroups.has(i))optionGroups.set(i,[]);
    optionGroups.get(i).push(field);
  }
  function progress(index=null){
    const fields=index===null?[...optionGroups.values()].flat():optionGroups.get(index)||[];
    fields.forEach(button=>{
      const i=Number(button.dataset.question),j=Number(button.dataset.option),a=answers[i];
      const selected=Array.isArray(a)?a.includes(j):a===j;
      button.checked=selected;
    });
  }
  progress();
  view.querySelectorAll('[data-option],.answer').forEach(input=>{
    input.disabled=submitted;
    const i=Number(input.dataset.question);
    if(input.hasAttribute('data-option'))input.onclick=()=>{
      answers[i]=toggle(answers[i],Number(input.dataset.option),exam.questions[i].type===1);
      rememberAnswer(i);progress(i);
      if(input.type==='radio' && input.checked){
        document.querySelector('.question-pager [data-next]')?.click();
      }
    };
    else if(input.dataset.part){
      const q=exam.questions[i],numbers=subquestionNumbers(q),n=input.dataset.part;
      const article=input.closest('article');
      const select=input.closest('.code-editor')?.querySelector('select');
      input.value=subquestionParts(numbers,answers[i])[n]??'';
      if(select)paintCode(input,select.value);
      const store=()=>{
        const parts={...subquestionParts(numbers,answers[i]),[n]:input.value};
        answers[i]=select?{parts,language:select.value}:{parts};
        rememberAnswer(i);progress(i);
      };
      input.oninput=()=>{if(select)paintCode(input,select.value);store()};
      if(select)select.onchange=()=>{
        for(const editor of article.querySelectorAll('.subquestion-answer .code-editor')){
          editor.querySelector('select').value=select.value;
          paintCode(editor.querySelector('textarea'),select.value);
        }
        store();
      };
    }
    else if(exam.questions[i].type===5){
      const select=input.closest('.code-editor').querySelector('select');
      input.value=codeText(answers[i]);
      select.disabled=submitted;
      paintCode(input,select.value);
      input.oninput=select.onchange=()=>{
        answers[i]={code:input.value,language:select.value};
        paintCode(input,select.value);
        rememberAnswer(i);progress(i);
      };
    }else if(input.hasAttribute('data-blank')){
      input.oninput=()=>{
        const values=blankValues(exam.questions[i],answers[i]);
        values[Number(input.dataset.blank)]=input.value;
        answers[i]=values;
        rememberAnswer(i);
      };
    }else input.oninput=()=>{answers[i]=input.value;rememberAnswer(i);progress(i)};
  });
  if(hosted?.id&&submitted){
    exam.questions.forEach((q,index)=>{
      const reference=document.createElement('div');
      reference.className='reference-answer prompt';
      const title=document.createElement('strong');
      title.textContent='参考答案';
      const value=q.type>=4?q.referenceAnswer:q.referenceAnswer?.trim();
      let text=value||'教师未提供';
      if(value&&q.type===3){
        text=formatBlanks(splitBlanks(value,questionBlankCount(q)||1));
      }else if(value&&q.type===2){
        text=/^(?:T|true|对|正确|是|√|✓)$/i.test(value)?'正确':'错误';
      }
      if(q.type>=4){
        reference.append(title);
        const numbers=q.type===5?subquestionNumbers(q):[];
        if(numbers.length){
          const parts=subquestionParts(numbers,value);
          for(const n of numbers)reference.insertAdjacentHTML('beforeend','<p>小题 ('+n+')</p>'+readOnlyCode(parts[n]||'教师未提供',q.defaultLanguage||'Python'));
        }else reference.insertAdjacentHTML('beforeend',readOnlyCode(text,q.type===4?'text':(q.defaultLanguage||'Python')));
      }else reference.append(title,document.createElement('br'),document.createTextNode(text));
      const detail=document.createElement('p');
      detail.id='question-score-'+index;detail.className='prompt';
      const article=byId('exam-question-'+index);
      if(Object.hasOwn(hosted?.lateAnswers??{},index)){
        const late=hosted.lateAnswers[index],supplement=document.createElement('div'),label=document.createElement('strong');
        label.textContent='到期后同步的离线作答';
        const content=document.createElement('pre');
        content.textContent=late?.parts?subquestionText(q,late):q.type===5?codeText(late):q.type<3?[late].flat().filter(v=>v!=null).map(v=>options(q)[v]).join('、'):Array.isArray(late)?formatBlanks(late):late??'未作答';
        supplement.append(label,content);article.append(supplement);
      }
      (article.querySelector('.written-answer')||article).append(reference,detail);
    });
    const status=document.createElement('div');
    status.id='published-score';
    status.innerHTML='<p data-summary aria-live="polite"></p>';
    byId('paper-cover').querySelector('.score-heading').after(status);
    renderStudentScores(hosted.scoreReport);
  }
  if(hosted?.id||previewingDraft)byId('import').parentElement.hidden=true;
  byId('import').onchange=async event=>{
    try{
      const paper=JSON.parse(await event.target.files[0].text());
      if(!valid(paper))return notice('试卷格式无效或总分不匹配。');
      if(answers.some(answered)&&JSON.stringify(paper)!==JSON.stringify(exam)&&!await showExamMessage('导入新试卷会清除当前答题记录。继续吗？','导入'))return;
      install(paper);student();notice('试卷已导入。');
    }catch{notice('无法读取试卷文件。')}
  };
  if(submitted){
    if(hosted?.id)byId('restart').hidden=true;
    byId('restart').onclick=async ()=>{
      if(!await showExamMessage('清除当前答卷并重新作答？','重新作答'))return;
      answers=[];marked.clear();save(marksKey,[]);submitted=false;deadline=0;save('practice-deadline',0);save('practice-answers-v1',answers);save('practice-submitted-v1',false);student();notice('');
    };
  }else{
    byId('submit').onclick=()=>submitAttempt(false);
  }
  let sending=false;
  async function submitAttempt(expired){
    if(sending||submitted||loginRequired)return;
    const remaining=exam.questions.filter((_,i)=>!questionComplete(i)).length;
    if(!expired&&!await showExamMessage(remaining?'还有 '+remaining+' 题未答。确认交卷？':'确认交卷？','交卷'))return;
    if(sending||submitted||loginRequired)return;
    sending=true;
    if(hosted?.id){
      const inputs=[submitButton,...view.querySelectorAll('[data-option],.answer,.code-language')];
      inputs.forEach(input=>input.disabled=true);
      try{
        const response=await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:hosted.account,id:hosted.id,revision:hosted.revision,answerCard:makeAnswerCard(exam.questions,answers),changed:[...pending.keys()]})});
        if(response.status===401){sending=false;await renewLogin();if(!expired)inputs.forEach(input=>input.disabled=false);return}
        if(response.status===409&&response.headers.get('X-Exam-Submitted')!=='1'){location.reload();return}
        if(!response.ok&&response.headers.get('X-Exam-Submitted')!=='1')throw Error(await response.text());
        await returnAfterSubmission(expired,response.headers.get('X-Exam-Late-Sync')==='1');return;
      }catch(e){
        if(expired){
          draftStatus('时间已到，正在等待服务器确认交卷。');
          setTimeout(()=>{sending=false},2000);
        }else{
          sending=false;inputs.forEach(input=>input.disabled=false);notice('交卷失败：'+e.message);
        }
        return;
      }
    }
    submitted=true;save('practice-submitted-v1',true);student();notice(expired?'考试时间已到，已自动交卷。':'已交卷。');
  }
  function runClock(){
    const clock=document.createElement('div');
    clock.className='exam-clock';
    clock.setAttribute('role','timer');
    view.prepend(clock);
    function tick(){
      const seconds=Math.max(0,Math.ceil((deadline-(Date.now()+clockOffset))/1000));
      clock.textContent='剩余时间 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
      if(!seconds)submitAttempt(true);
    }
    timer=setInterval(tick,500);
    tick();
  }
  if(!submitted&&exam.minutes>0&&deadline)runClock();
  else view.insertAdjacentHTML('afterbegin','<p class="exam-clock cover-clock">'+(submitted?'已交卷':exam.minutes?'限时 '+exam.minutes+' 分钟，开始答题后计时':'不限时')+'</p>');
}
/* admin-only */
let activeView=initialView;
let readDraft, parkedEditor, previousState, lastPreview;
function openPreview(){
  const paper=readDraft();
  // Incomplete questions can be previewed while their fields are still being edited.
  if(!paper.title)paper.title='未命名试卷';
  for(const q of paper.questions)if(!Number.isFinite(q.score))q.score=0;
  if(!Number.isFinite(paper.target))paper.target=total(paper.questions);
  parkedEditor=Array.from(view.childNodes);
  previousState={exam,answers,submitted,deadline,marked};
  const sameDraft=lastPreview&&JSON.stringify(lastPreview.exam)===JSON.stringify(paper);
  exam=paper;
  marked=sameDraft?lastPreview.marked:new Set();
  answers=sameDraft?lastPreview.answers:[];
  submitted=sameDraft?lastPreview.submitted:false;
  deadline=sameDraft?lastPreview.deadline:0;
  previewingDraft=true;
}
function restoreEditor(){
  if(navDialog.open)navDialog.close();
  submitButton.hidden=true;
  clearInterval(timer);
  lastPreview={exam,answers,submitted,deadline,marked};
  ({exam,answers,submitted,deadline,marked}=previousState);
  previewingDraft=false;
  view.replaceChildren(...parkedEditor);
  parkedEditor=null;
  previousState=null;
  document.querySelector('.toolbar h1').textContent='';
  document.title='Python 阶段考试';
}
function render(){
  notice('');
  for(const id of ['teacher','student'])byId(id).setAttribute('aria-pressed',activeView===id);
  if(activeView==='student'){
    submitButton.after(navToggle);
    student();
  }else{
    byId('paper-actions-toggle').after(navToggle);
    if(parkedEditor)restoreEditor();
    else readDraft=editor();
    navToggle.hidden=!view.querySelector('#questions article');
  }
}
for(const id of ['teacher','student'])byId(id).onclick=()=>{
  if(activeView===id)return;
  if(id==='student'){
    if(view.querySelector('#publish:disabled,#save:disabled,#upload-paper button:disabled'))return notice('正在保存或发布，请稍候。');
    openPreview();
  }
  activeView=id;
  render();
};
render();
if(hosted?.teacher && location.hash==='#trial'){
  history.replaceState(history.state,'',location.pathname+location.search);
  byId('student').click();
}
/* /admin-only */
/* user-only */
(async()=>{
const active=hosted?.id&&!hosted.unstarted&&!submitted;
const cachedStart=globalThis.examOfflineClock!==undefined;
const promptResume=active&&!location.hash&&!cachedStart;
if(active&&cachedStart&&!location.hash)history.replaceState(null,'','/?paper='+hosted.id+'#resume-question');
const restored=active?await restoreOfflineDraft():true;
if(hosted?.id&&submitted){
  if(hosted.expiredOffline){
    async function recoverExpired(){
      try{
        if(!await restoreOfflineDraft())throw Error();
        const hadChanges=pending.size>0;
        await syncExpiredChanges();
        await clearOfflineDraft();
        if(hadChanges){save(pendingKey,{});location.reload()}
      }catch{draftStatus('离线作答尚未补同步，请保持连接。');setTimeout(recoverExpired,5000)}
    }
    void recoverExpired();
  }else void clearOfflineDraft();
}
student();
if(active){
  if(!cachedStart&&hosted.account){
    async function cacheStartedExam(){
      if(!('serviceWorker' in navigator)){draftStatus('离线重开需要 HTTPS 或本机 localhost。');return}
      await navigator.serviceWorker.register('/offline-exam-sw.js');
      await navigator.serviceWorker.ready;
      const styles=await caches.open('exam-offline-styles-v1');
      await styles.addAll([...document.querySelectorAll('link[rel="stylesheet"]')].map(link=>link.href));
      const url='/?paper='+hosted.id,response=await fetch(url,{cache:'no-store'});
      if(response.headers.get('X-Offline-Exam')!==encodeURIComponent(hosted.account)+':'+hosted.id+':'+hosted.revision)return;
      const body=(await response.text()).replace('<head>','<head><script>globalThis.examOfflineClock='+clockOffset+';<'+ '/script>');
      const cache=await caches.open('exam-offline-paper-v1');
      await cache.put(url,new Response(body,{headers:{'Content-Type':'text/html; charset=utf-8','X-Offline-Owner':encodeURIComponent(hosted.account)}}));
      draftStatus('已支持离线重开。');
    }
    const prepare=()=>cacheStartedExam().catch(()=>draftStatus('离线页面尚未准备好，联网后将重试。'));
    window.addEventListener('online',prepare);void prepare();
  }
  if(!restored)draftStatus('无法读取本机离线草稿。');
  window.addEventListener('online',syncDraft);void syncDraft();
  if(promptResume&&(!hosted.deadline||Date.now()+clockOffset<hosted.deadline)){
    const resume=await showExamMessage('《'+exam.title+'》尚未交卷，是否继续考试？','继续考试');
    if(resume&&!submitted&&(!hosted.deadline||Date.now()+clockOffset<hosted.deadline)){
      revealQuestion(byId(read('last-question',''))||view.querySelector('article'));
    }
  }
}
if(hosted?.id && location.hash==='#question-nav' && !navToggle.hidden){
  history.replaceState(history.state,'',location.pathname+location.search);
  navToggle.focus();
  navToggle.click();
}
})();
/* /user-only */
</script>
</body>
